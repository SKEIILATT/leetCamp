server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probed by the compose healthcheck (see deploy/docker-compose.yml).
    # Deliberately NOT `/`: with the SPA fallback below, `/` always returns
    # 200 even when the static directory is empty, so it can't tell a healthy
    # nginx from one serving nothing.
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback: any path nginx can't resolve to a real file (an Angular
    # route like /reto or /admin/usuarios) falls back to index.html, where the
    # Angular router takes over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
