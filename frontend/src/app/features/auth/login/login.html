<div class="login-page">
  <form class="login-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="login-page__intro">
      <h1>Bienvenido de nuevo</h1>
      <p>Entra para continuar tu racha y resolver el reto de hoy.</p>
    </div>

    @if (justRegistered()) {
      <p class="login-page__success">Cuenta creada. Ya puedes iniciar sesión.</p>
    }

    @if (errorMessage()) {
      <p class="login-page__error">{{ errorMessage() }}</p>
    }

    <div class="login-page__fields">
      <label class="field">
        <span class="field__label">Correo institucional</span>
        <input type="email" formControlName="email" placeholder="nombre@espol.edu.ec" autocomplete="email" />
        @if (email.touched && email.invalid) {
          <span class="field__hint">Ingresa un correo válido.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        @if (password.touched && password.invalid) {
          <span class="field__hint">La contraseña es obligatoria.</span>
        }
      </label>
    </div>

    <div class="login-page__row">
      <label class="checkbox">
        <input type="checkbox" />
        Mantener sesión iniciada
      </label>
      <a href="#" class="link">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Iniciar sesión' }}
    </button>

    <p class="login-page__footer">¿No tienes cuenta? <a routerLink="/register" class="link">Regístrate</a></p>
  </form>

  <app-auth-brand-panel tag="Reto diario" />
</div>
