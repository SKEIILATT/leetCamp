<div class="login-page">
  <form class="login-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="login-page__intro">
      <h1>Crea una nueva contraseña</h1>
      <p>Elige una contraseña nueva para tu cuenta.</p>
    </div>

    @if (errorMessage()) {
      <p class="login-page__error">{{ errorMessage() }}</p>
    }

    <div class="login-page__fields">
      <label class="field">
        <span class="field__label">Nueva contraseña</span>
        <input
          type="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
        />
        @if (password.touched && password.invalid) {
          <span class="field__hint">La contraseña debe tener al menos 8 caracteres.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Confirmar contraseña</span>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        @if (confirmPassword.touched && form.hasError('passwordsMismatch')) {
          <span class="field__hint">Las contraseñas no coinciden.</span>
        }
      </label>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Actualizando…' : 'Actualizar contraseña' }}
    </button>

    <p class="login-page__footer"><a routerLink="/login" class="link">Volver a iniciar sesión</a></p>
  </form>

  <app-auth-brand-panel tag="Nueva contraseña" />
</div>
