<div class="shell">
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <img src="CBBLANCO.png" alt="Coding Bootcamps ESPOL" />
    </div>

    @if (!isAdmin()) {
      <div class="shell__stats">
        <div class="stat">
          <span class="stat__value">{{ streakService.streak()?.currentStreak ?? 0 }}</span>
          <span class="stat__label">🔥 Días de racha</span>
        </div>
        <div class="stat">
          <span class="stat__value">{{ streakService.streak()?.totalPoints ?? 0 }}</span>
          <span class="stat__label">Puntos</span>
        </div>
      </div>
    }

    <nav class="shell__nav">
      @if (!isAdmin()) {
        <a routerLink="/reto" routerLinkActive="is-active" class="shell__nav-link">Reto del día</a>
        <a routerLink="/dashboard" routerLinkActive="is-active" class="shell__nav-link">Dashboard</a>
        <a routerLink="/historial" routerLinkActive="is-active" class="shell__nav-link">Historial</a>
        <a routerLink="/ranking" routerLinkActive="is-active" class="shell__nav-link">Ranking</a>
        <a routerLink="/perfil" routerLinkActive="is-active" class="shell__nav-link">Perfil</a>
      }

      @if (isAdmin()) {
        <a routerLink="/admin/dashboard" routerLinkActive="is-active" class="shell__nav-link">Dashboard</a>
        <a routerLink="/admin/preguntas" routerLinkActive="is-active" class="shell__nav-link">Preguntas</a>
        <a routerLink="/admin/taxonomia" routerLinkActive="is-active" class="shell__nav-link">Categorías</a>
        <a routerLink="/admin/reto-diario" routerLinkActive="is-active" class="shell__nav-link">Programar reto</a>
        <a routerLink="/admin/usuarios" routerLinkActive="is-active" class="shell__nav-link">Usuarios</a>
      }
    </nav>

    <button type="button" class="shell__logout" (click)="logout()">Cerrar sesión</button>
  </aside>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
